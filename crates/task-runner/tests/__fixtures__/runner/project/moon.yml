tasks:
  base:
    command: noop

  outputs:
    command: noop
    outputs:
      - 'file.txt'

  dep:
    command: noop

  has-deps:
    command: noop
    deps:
      - 'dep'

  has-output-dep:
    command: noop
    outputs:
      - 'file.txt'
    deps:
      - target: 'outputs'
        cacheStrategy: 'outputs'

  has-ignored-output-dep:
    command: noop
    deps:
      - target: 'outputs'
        cacheStrategy: 'outputs'

  no-deps:
    command: noop

  no-cache:
    command: noop
    options:
      cache: false

  cache-lifetime:
    command: noop
    options:
      cacheLifetime: '2s'
